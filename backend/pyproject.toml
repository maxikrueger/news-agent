[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-agent-backend"
version = "0.1.0"
description = "News Agent backend: personalised AI news digests from RSS feeds"
requires-python = ">=3.12"
authors = [{name = "Maximilian Krüger"}]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "httpx==0.25.2",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "alembic==1.12.1",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "argon2-cffi==21.3.0",
    "python-multipart==0.0.6",
    "requests==2.31.0",
    "openai>=1.12.0",
    "feedparser==6.0.10",
    "email-validator==2.0.0",
    "croniter==2.0.1",
    "python-dotenv==1.0.0",
    "tenacity==8.2.3",
    "sendgrid==6.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-requests",
    "types-croniter",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/"]
